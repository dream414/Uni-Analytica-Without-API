name: Deploy React Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        working-directory: ./multilingual-data-frontend
        run: npm install

      - name: Build React Project
        working-directory: ./multilingual-data-frontend
        run: npm run build

      - name: Upload Build Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./multilingual-data-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
      

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
